name: flutter_app
description: "Field Intelligence App for Native Plants - AR + AI Assistant for India's Native Flora"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  http_parser: ^4.0.2
  image_picker: ^1.0.7
  camera: ^0.10.5+9
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.2
  google_mlkit_object_detection: ^0.17.1
  ar_flutter_plugin_plus: ^1.1.3
  flutter_riverpod: ^2.5.1
  google_generative_ai: ^0.4.7
  vector_math: ^2.2.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - .env
